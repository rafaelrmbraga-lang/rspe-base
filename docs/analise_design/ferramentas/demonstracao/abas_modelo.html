<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APTO · abas simuladas</title>
<style>
__FONTS__
:root{
  --verde:#1D5A3B; --verde-esc:#123824; --verde-claro:#E9F0EB; --ouro:#B8975A;
  --fundo:#F4F5F2; --sup:#FFFFFF; --sup2:#FAFAF8; --fio:#E1E4DF; --fio2:#C9CEC8;
  --tx:#1C211E; --tx2:#4A514C; --tx3:#5F6762;
  --crit:#9F1D1A; --crit-bg:#FBECEA; --crit-f:#C4302B;
  --u30:#8F4300;  --u30-bg:#FDF0E2;  --u30-f:#D9782A;
  --u60:#6E5500;  --u60-bg:#F8F1DA;  --u60-f:#C29A1B;
  --ok:#1F5E38;   --ok-bg:#E7F2EA;   --ok-f:#3B8C5A;
  --neu:#4A514C;  --neu-bg:#F0F1EE;  --neu-f:#C9CEC8;
  --ext:#284A6B;  --ext-bg:#E8EEF5;  --ext-f:#4E7299;
  --sans:"Source Sans 3",Arial,sans-serif; --serif:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 var(--sans);color:var(--tx);background:var(--fundo);display:flex;flex-direction:column;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.topo{display:flex;align-items:center;gap:16px;padding:10px 28px;background:var(--sup);border-bottom:1px solid var(--fio);position:relative;flex:none}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:linear-gradient(90deg,var(--verde) 0 82%,var(--ouro) 82% 100%)}
.marca{display:flex;align-items:center;gap:12px}.marca img{width:40px;height:40px}
.marca b{display:block;font:700 19px/1 Cinzel,serif;letter-spacing:3px;color:var(--verde-esc)}
.marca small{display:block;font-size:11.5px;color:var(--tx3);margin-top:3px}
.base{margin-left:12px;padding:6px 12px;border:1px solid var(--fio2);border-radius:6px;font-size:13px;color:var(--tx2);background:var(--sup2)}.base b{color:var(--tx)}
.esp{flex:1}
.busca{position:relative}.busca input{width:300px;height:36px;padding:0 12px 0 36px;border:1px solid var(--fio2);border-radius:6px;font:inherit;background:var(--sup)}
.busca svg{position:absolute;left:12px;top:11px;width:15px;height:15px;color:var(--tx3)}
.btn{height:36px;padding:0 16px;border:1px solid var(--fio2);border-radius:6px;background:var(--sup);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.abas{display:flex;align-items:flex-end;gap:2px;padding:10px 28px 0;margin-top:3px;flex:none;border-bottom:1px solid var(--fio)}
.aba{padding:9px 11px 10px;border:0;background:none;color:var(--tx2);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.aba span{color:var(--tx3);margin-left:5px;font-weight:600}
.aba.on{color:var(--verde-esc);font-weight:700;border-bottom-color:var(--verde)}.aba.on span{color:var(--verde)}
.abas .div{width:1px;height:20px;background:var(--fio2);margin:0 10px 12px}
.abas .mais{color:var(--tx3)}
.cab{display:flex;align-items:flex-end;gap:20px;padding:16px 28px 12px;flex:none}
.cab h1{margin:0;font:600 24px/1.15 var(--serif);color:var(--verde-esc)}
.cab p{margin:4px 0 0;color:var(--tx3);font-size:13px}
.ordem{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.ordem label{font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3)}
.seg{display:inline-flex;padding:3px;background:#E7EAE5;border-radius:8px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:6px;font-weight:600;color:var(--tx2);font-size:13.5px}
.seg button.on{background:var(--sup);color:var(--verde-esc);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cartoes{display:flex;gap:10px;padding:0 28px 12px;flex:none}
.cartao{flex:1;min-width:0;position:relative;border:1px solid var(--fio);background:var(--sup);border-radius:8px;padding:9px 12px 8px 15px}
.cartao::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.cartao b{display:block;font:600 22px/1.1 var(--serif)}
.cartao span{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartao.crit b{color:var(--crit)}
.lista{flex:1;min-height:0;margin:0 28px;background:var(--sup);border:1px solid var(--fio);border-radius:8px 8px 0 0;overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{background:var(--sup2);text-align:left;font-size:12px;font-weight:700;color:var(--tx2);padding:10px 12px;border-bottom:1px solid var(--fio2);white-space:nowrap}
thead th.ativa{color:var(--verde-esc)}thead th.ativa::after{content:" ↑";color:var(--verde)}
tbody td{padding:0 12px;height:44px;border-bottom:1px solid #EDEFEB;font-size:13.5px;vertical-align:middle}
tbody tr.l td:first-child{box-shadow:inset 3px 0 0 var(--fc,transparent)}
td.nome{font-weight:600;white-space:nowrap}td.proc{white-space:nowrap;color:var(--tx2)}td.dt{white-space:nowrap}
tr.grupo td{height:34px;background:#F1F3EF;border-bottom:1px solid var(--fio);font-size:12.5px;color:var(--tx2)}
tr.grupo td b{font-weight:700;color:var(--tx);margin-right:6px}
tr.grupo .tag{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:8px;vertical-align:-1px}
.sit{display:inline-flex;align-items:baseline;gap:6px;padding:3px 9px;border-radius:5px;background:var(--b);color:var(--t);font-size:13px;line-height:1.35}
.sit b{font-weight:700;white-space:nowrap}
.sit.sc{padding-left:0;background:none}
.dec{display:inline-flex;align-items:center;padding:3px 8px;border-radius:5px;background:var(--b);color:var(--t);font-size:12.5px;font-weight:600;white-space:nowrap}
.dec.sc{background:none;color:var(--tx3);font-weight:400;padding-left:0}
.ped{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--fio2);border-radius:6px;background:var(--sup);font-size:12.5px;color:var(--tx2);white-space:nowrap}
.ped .cx{width:14px;height:14px;border:1.5px solid var(--tx3);border-radius:3px}
.link{color:var(--verde);font-weight:600;font-size:12.5px;white-space:nowrap}
.rod{display:flex;gap:18px;align-items:center;margin:0 28px 14px;padding:8px 14px;background:var(--sup);border:1px solid var(--fio);border-top:0;border-radius:0 0 8px 8px;font-size:12px;color:var(--tx3);flex:none}
.alt{display:inline-flex;padding:3px;background:#E7EAE5;border-radius:8px;margin:0 28px 10px;align-self:flex-start}
.alt button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:600;color:var(--tx2);font-size:13px}.alt button.on{background:var(--sup);color:var(--verde-esc);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* linha expandida */
tr.exp td{background:#FBFCFA;padding:14px 18px 16px 22px;height:auto;border-bottom:1px solid var(--fio2)}
.blo{border:1px solid var(--fio);border-left:3px solid var(--c);border-radius:6px;background:var(--sup);padding:12px 14px;margin-bottom:10px}
.blo h4{margin:0 0 6px;font:600 14.5px var(--serif);color:var(--tx);display:flex;gap:10px;align-items:baseline}
.blo h4 .sit{font:inherit;font-size:12.5px}
.blo p{margin:0 0 6px;font-size:13px;color:var(--tx2);max-width:1100px}
.blo .acoes{display:flex;gap:8px;margin-top:8px}
.passos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:6px 0 8px}
.passos div{border:1px solid var(--fio);border-radius:6px;padding:8px 10px;background:var(--sup2);font-size:12.5px}
.passos small{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:2px}
.passos b{font:600 15px var(--serif)}
/* painel e modal */
.veu{position:fixed;inset:0;background:rgba(18,28,22,.38);z-index:5}
.painel{position:fixed;top:0;right:0;bottom:0;width:780px;background:var(--sup);z-index:6;box-shadow:-12px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column}
.ph{padding:18px 28px 14px;border-bottom:1px solid var(--fio)}
.ph h2{margin:0;font:600 24px var(--serif);color:var(--verde-esc)}
.ph .meta{color:var(--tx2);margin-top:4px;font-size:13.5px}
.ph .acoes{display:flex;gap:8px;margin-top:12px}
.pb{flex:1;overflow:hidden;padding:16px 28px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.kv div{border:1px solid var(--fio);border-radius:6px;padding:7px 11px}.kv small{display:block;color:var(--tx3);font-size:12px}.kv b{font:600 16px var(--serif)}
.sec h3{margin:16px 0 6px;font:600 16px var(--serif);color:var(--verde-esc);padding-bottom:5px;border-bottom:1px solid var(--fio)}
.ben{width:100%;border-collapse:collapse}.ben td{padding:9px 6px;border-bottom:1px solid #EDEFEB;vertical-align:top;height:auto;font-size:13.5px}
.ben td:first-child{width:112px;color:var(--tx2)}.ben td.dt{width:100px}
.porque{border:1px solid var(--fio);border-left:3px solid var(--u60-f);border-radius:6px;padding:12px 14px;margin-top:8px;background:var(--sup)}
.porque h4{margin:0 0 6px;font:600 14.5px var(--serif)}
.porque p{margin:0 0 6px;font-size:13px;color:var(--tx2)}
.modal-f{position:fixed;inset:0;z-index:6;display:grid;place-items:center}
.modal{width:760px;background:var(--sup);border-radius:10px;box-shadow:0 20px 48px rgba(0,0,0,.25);overflow:hidden}
.mh{padding:20px 26px 6px}.mh h2{margin:0;font:600 22px var(--serif);color:var(--verde-esc)}.mh p{margin:4px 0 0;color:var(--tx2);font-size:13.5px}
.mb{padding:10px 26px 4px}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tot div{border:1px solid var(--fio);border-radius:8px;padding:10px 12px;position:relative}
.tot div::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.tot b{display:block;font:600 26px var(--serif)}.tot span{font-size:12.5px;color:var(--tx2)}
.gr{border:1px solid var(--fio);border-radius:8px;margin-bottom:8px}
.gr summary{display:flex;gap:8px;align-items:center;padding:10px 14px;font-weight:700;list-style:none}
.gr summary .n{margin-left:auto;font-weight:400;color:var(--tx2)}
.gr ul{margin:0;padding:0 14px 10px 32px;color:var(--tx2);font-size:13px}.gr li{margin:3px 0}
.gr code{font:12.5px Consolas,monospace;color:var(--tx)}
.mf{display:flex;gap:8px;padding:12px 26px;border-top:1px solid var(--fio);margin-top:10px}
.prog-imp{position:fixed;right:40px;bottom:64px;width:380px;background:var(--sup);border:1px solid var(--fio2);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:14px 16px;z-index:4}
.prog-imp b{font:600 15px var(--serif)}.prog-imp .tr{height:6px;background:#E3E7E4;border-radius:3px;margin:10px 0 8px}.prog-imp .tr i{display:block;height:100%;width:46%;background:var(--verde);border-radius:3px}
.prog-imp small{display:block;color:var(--tx2);font-size:12.5px}
</style></head>
<body>
<header class="topo">
  <div class="marca"><img src="__SELO__" alt=""><div><b>APTO</b><small>Defensoria Pública de Mato Grosso do Sul · Execução penal</small></div></div>
  <div class="base">Base <b>Comarca Fictícia</b> · 144 assistidos</div>
  <div class="esp"></div>
  <label class="busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Buscar nome, nº do processo ou crime"></label>
  <button class="btn">Exportar</button><button class="btn pri">Importar PDFs</button>
</header>
<nav class="abas" id="abas"></nav>
<section class="cab"><div><h1 id="tit"></h1><p id="sub"></p></div><div class="esp"></div><div id="ordem"></div></section>
<div id="extra"></div>
<div class="cartoes" id="cartoes"></div>
<main class="lista"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></main>
<div class="rod" id="rod"></div>
<div id="sobre"></div>
<script>
const R = __DADOS__;
const P = new URLSearchParams(location.search);
const ABA = P.get('aba') || 'prog', ORDEM = P.get('ordem') || 'urg', SOBRE = P.get('sobre') || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const semAc = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// tons: a cor que o APTO já calcula (campo *_cor) vira um tom; a semântica de cada aba não muda
const TOM = { vencido:'crit', vermelho:'crit', laranja:'u30', amarelo:'u60', verde:'ok', azul:'ext', cinza:'neu', '':'' };
const t = (k, v) => `--${k}:var(--${v})`;
// grupos e rótulos de cada aba (os mesmos do LEIA-ME e da legenda de hoje)
const G = {
  prazo: [['vencido','Vencidos'],['laranja','Vence em até 30 dias'],['amarelo','Vence em até 60 dias ou a verificar'],['verde','Vence em até 90 dias'],['','Em cumprimento, mais de 90 dias'],['cinza','Sem prazo: não se aplica, cumprida, interrompida, suspensa'],['azul','Execução extinta']],
  ind:   [['verde','Algum benefício possível'],['amarelo','A verificar'],['vermelho','Crime impeditivo, nenhum possível'],['cinza','Nenhum benefício alcançado'],['azul','Execução extinta']],
  presc: [['vermelho','Prescrição aparente'],['amarelo','Iminente ou a verificar'],['','Não prescrita'],['cinza','Sem dados'],['azul','Execução extinta']],
  ext:   [['vermelho','Extinção cabível'],['laranja','Término em até 30 dias'],['amarelo','A verificar ou término em até 60 dias'],['verde','Término em até 90 dias'],['','Em cumprimento'],['cinza','Sem previsão'],['azul','Pena extinta (registrada)']],
  fd:    [['vermelho','Atestado sem peticionamento'],['amarelo','Verificar remição / pontos a conferir'],['verde','Em ordem'],['cinza','Sem ficha']],
  aud:   [['vermelho','Com alertas'],['amarelo','Pontos a verificar'],['verde','Guia em ordem'],['azul','Execução extinta']],
};
const CART = {
  prazo: [['vencido','Vencido'],['laranja','Até 30 dias'],['amarelo','Até 60 dias / a verificar'],['verde','Até 90 dias'],['','Mais de 90 dias'],['cinza','Sem prazo'],['azul','Extinta']],
  ind: [['verde','Benefício possível'],['amarelo','A verificar'],['vermelho','Impeditivo'],['cinza','Nada alcançado'],['azul','Extinta']],
  presc: [['vermelho','Prescrição aparente'],['amarelo','Iminente / a verificar'],['','Não prescrita'],['cinza','Sem dados'],['azul','Extinta']],
  ext: [['vermelho','Extinção cabível'],['laranja','Até 30 dias'],['amarelo','A verificar / até 60'],['verde','Até 90 dias'],['','Em cumprimento'],['cinza','Sem previsão'],['azul','Extinta']],
  fd: [['vermelho','Atestado sem peticionamento'],['amarelo','Verificar remição'],['verde','Em ordem'],['cinza','Sem ficha']],
  aud: [['vermelho','Com alertas'],['amarelo','Pontos a verificar'],['verde','Guia em ordem'],['azul','Extinta']],
};
const ABAS = {
  geral:{t:'Visão geral da base', cor:'geral_cor', dias:null, g:null,
    cols:[['nome','Nome'],['proc','Nº da execução'],['regime','Regime'],['prog','Progressão','dt'],['liv','Livramento','dt'],['termino','Término','dt'],['_hist','']]},
  prog:{t:'Progressão de regime', cor:'prog_cor', dias:'prog_dias', g:'prazo', pil:'prog_sit',
    cols:[['nome','Nome'],['proc','Nº da execução'],['regime','Regime'],['prog','Data da progressão','dt'],['prog_sit','Situação'],['conduta','Conduta (ficha)'],['falta','Falta (12 meses)'],['_ped','Pedido']]},
  liv:{t:'Livramento condicional', cor:'liv_cor', dias:'liv_dias', g:'prazo', pil:'liv_sit',
    cols:[['nome','Nome'],['proc','Nº da execução'],['liv','Data do livramento','dt'],['liv_sit','Situação'],['conduta','Conduta (ficha)'],['falta','Falta (12 meses)'],['_ped','Pedido']]},
  ind:{t:'Indulto e comutação', cor:'ind_cor', dias:null, g:'ind',
    cols:[['nome','Nome'],['proc','Nº da execução'],['imp','Impeditivo (art. 1º)','d:imp_cor'],['i22','Indulto 2022','d:i22_cor'],['i24','Indulto 2024','d:i24_cor'],['c24','Comutação 2024','d:c24_cor'],['i25','Indulto 2025','d:i25_cor'],['c25','Comutação 2025','d:c25_cor'],['_ped','Pedido']]},
  presc:{t:'Prescrição', cor:'presc_ppe_cor', dias:'presc_dias', g:'presc', pil:'presc_ppe',
    cols:[['nome','Nome'],['proc','Nº da execução'],['presc_ppe','Pretensão executória'],['presc_prox','Prescrição em','dt'],['_det','Detalhe'],['_ped','Pedido']]},
  ext:{t:'Extinção da pena', cor:'ext_cor', dias:'ext_dias', g:'ext', pil:'ext_sit',
    cols:[['nome','Nome'],['proc','Nº da execução'],['ext_termino','Término','dt'],['ext_sit','Situação'],['_ped','Pedido']]},
  fd:{t:'Ficha disciplinar', cor:'fd_cor', dias:null, g:'fd', pil:'fd_sit',
    cols:[['nome','Nome'],['proc','Nº da execução'],['fd_trab','Trabalho atual'],['fd_atestar','Trabalho a atestar'],['fd_estudo','Estudo a requerer'],['fd_sit','Situação'],['_ped','Pedido']]},
  aud:{t:'Auditoria do cálculo', cor:'aud_cor', dias:null, g:'aud', pil:'aud_resumo',
    cols:[['nome','Nome'],['proc','Nº da execução'],['aud_resumo','Resultado da auditoria'],['_det','Detalhe']]},
};
const A = ABAS[ABA];
const NAV = [['geral','Geral',null],['|'],['prog','Progressão',13],['liv','Livramento',5],['ext','Extinção',14],['presc','Prescrição',19],['|'],['ind','Indulto e comutação',85],['|'],['fd','Ficha disciplinar',3],['aud','Auditoria',60],['|'],['base','Dados da base',null],['geo','Dados prisionais',null],['teses','Jurisprudências',null],['quadro','Quadro',null]];
document.getElementById('abas').innerHTML = NAV.map(n => n[0]==='|' ? '<span class="div"></span>' : `<button class="aba ${n[0]===ABA?'on':''}">${n[1]}${n[2]!=null?`<span>${n[2]}</span>`:''}</button>`).join('');
document.getElementById('tit').textContent = A.t;
document.getElementById('sub').textContent = 'Referência 12/10/2026 · base jurídica 2026-10-08i · 144 assistidos';
if (A.g) document.getElementById('ordem').innerHTML = `<div class="ordem"><label>Ordem da lista</label><div class="seg"><button class="${ORDEM==='alfa'?'on':''}">Alfabética</button><button class="${ORDEM==='urg'?'on':''}">Por situação</button></div></div>`;
if (ABA==='presc') document.getElementById('extra').innerHTML = `<div class="alt"><button class="on">Pretensão executória</button><button>Pretensão punitiva</button></div>`;

const cor = r => r[A.cor] || '';
const ordG = A.g ? Object.fromEntries(G[A.g].map(([k],i) => [k,i])) : {};
let rs = R.slice();
if (A.g && ORDEM==='urg') rs.sort((a,b) => (ordG[cor(a)] ?? 99) - (ordG[cor(b)] ?? 99) || (A.dias ? (a[A.dias] ?? 1e9) - (b[A.dias] ?? 1e9) : 0) || semAc(a.nome).localeCompare(semAc(b.nome)));
else rs.sort((a,b) => semAc(a.nome).localeCompare(semAc(b.nome)));
if (P.get('so')) rs = rs.filter(r => cor(r) === P.get('so'));
// a linha aberta (expandida) vai para o topo do seu grupo, para caber na captura
if (P.get('expande')){ const i = rs.findIndex(r => r.id===P.get('expande')); if (i>=0){ const [x] = rs.splice(i,1); const j = rs.findIndex(r => cor(r)===cor(x)); rs.splice(j<0?0:j,0,x); } }

if (A.g) document.getElementById('cartoes').innerHTML = CART[A.g].map(([k,rot]) => { const n = R.filter(r => cor(r)===k).length; const tom = TOM[k] || 'neu';
  return `<div class="cartao ${tom==='crit'?'crit':''}" style="--c:var(--${tom}-f)"><b>${n}</b><span>${rot}</span></div>`; }).join('');
else document.getElementById('cartoes').style.display='none';

function situacao(txt, c){
  const tom = TOM[c]; const [p, ...resto] = String(txt||'—').split(' · ');
  const corpo = `<b>${esc(p)}</b>${resto.length ? `<span>· ${esc(resto.join(' · '))}</span>` : ''}`;
  return tom && tom!=='neu' ? `<span class="sit" style="${t('t',tom)};${t('b',tom+'-bg')}">${corpo}</span>` : `<span class="sit sc">${corpo}</span>`;
}
function celula(r, [k, rot, tipo]){
  if (k==='_ped') return `<td><span class="ped"><span class="cx"></span>Marcar</span></td>`;
  if (k==='_det') return `<td><span class="link">Ver cálculo e fundamentação</span></td>`;
  if (k==='_hist') return `<td style="text-align:right"><span class="link">Histórico (${r.hist_n||1})</span></td>`;
  if (k==='nome') return `<td class="nome">${esc(r.nome)}</td>`;
  if (k==='proc') return `<td class="proc">${esc(r.proc)}</td>`;
  if (tipo==='dt') return `<td class="dt">${esc(r[k]||'—')}</td>`;
  if (tipo && tipo.startsWith('d:')){ const c = r[tipo.slice(2)]||''; const tom = TOM[c];
    return `<td>${tom && tom!=='neu' ? `<span class="dec" style="${t('t',tom)};${t('b',tom+'-bg')}">${esc(r[k])}</span>` : `<span class="dec sc">${esc(r[k]||'—')}</span>`}</td>`; }
  if (k===A.pil) return `<td>${situacao(r[k], cor(r))}</td>`;
  return `<td>${esc(r[k] ?? '—')}</td>`;
}
document.getElementById('th').innerHTML = A.cols.map(([k,rot]) => `<th class="${(ORDEM==='alfa'||!A.g)&&k==='nome'?'ativa':(A.g&&ORDEM==='urg'&&k===A.pil)?'ativa':''}">${rot}</th>`).join('');
let h = '', ult = null; const exp = P.get('expande');
rs.slice(0, 40).forEach(r => { const c = cor(r);
  if (A.g && ORDEM==='urg' && c !== ult){ ult = c; const n = rs.filter(x => cor(x)===c).length; const rot = (G[A.g].find(g => g[0]===c)||[,c])[1]; const tom = TOM[c]||'neu';
    h += `<tr class="grupo"><td colspan="${A.cols.length}"><span class="tag" style="--c:var(--${tom}-f)"></span><b>${esc(rot)}</b>${n} ${n===1?'assistido':'assistidos'}</td></tr>`; }
  const tom = TOM[c]; const fio = tom && !['neu','ok','ext'].includes(tom) || (A.g!=='prazo' && tom==='ok') ? `--fc:var(--${tom}-f)` : '';
  h += `<tr class="l" style="${fio}">${A.cols.map(col => celula(r, col)).join('')}</tr>`;
  if (exp && r.id===exp) h += `<tr class="exp"><td colspan="${A.cols.length}">${expandida(r)}</td></tr>`;
});
document.getElementById('tb').innerHTML = h;
document.getElementById('rod').innerHTML = `<span>${rs.length} assistidos · ordem: ${A.g ? (ORDEM==='urg' ? 'por situação, o mais urgente primeiro' : 'alfabética') : 'alfabética'}</span><span class="esp"></span><span>Clique na linha para abrir o painel do assistido</span>`;

}
