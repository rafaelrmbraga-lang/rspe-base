<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia do documento</title>
<style>
  :root{--bg:#E9ECEE;--tx:#1E2226;--tx-2:#454B50}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 "Source Sans 3","Segoe UI",system-ui,sans-serif}
  #paginas{display:flex;flex-direction:column;align-items:safe center;gap:10px;padding:10px;width:max-content;min-width:100%;box-sizing:border-box}
  canvas{display:block;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .msg{padding:24px 16px;text-align:center;color:var(--tx-2);width:calc(100vw - 20px);box-sizing:border-box}
  .msg b{display:block;color:var(--tx);margin-bottom:4px}
  iframe{width:calc(100vw - 24px);height:100%;border:0;background:#fff}
  img{max-width:calc(100vw - 24px);display:block;margin:10px auto;background:#fff}
  .mais{margin:4px 0 14px;color:var(--tx-2);font-size:12px;width:calc(100vw - 24px);text-align:center}
  .sk{width:calc(100vw - 44px);max-width:620px;aspect-ratio:1/1.41;background:#fff;opacity:.6;margin:10px auto;animation:p 1.2s ease-in-out infinite alternate}
  @keyframes p{to{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.sk{animation:none}}
  html.janela #paginas{padding:16px}
  .zoom{position:fixed;right:14px;bottom:14px;z-index:2;display:flex;background:#1E2226;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);overflow:hidden}
  .zoom button{all:unset;cursor:pointer;color:#fff;font:600 13px/1 "Source Sans 3","Segoe UI",system-ui,sans-serif;min-width:34px;height:32px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
  .zoom button:hover{background:rgba(255,255,255,.14)}
  .zoom button:focus-visible{outline:3px solid #F2B705;outline-offset:-3px}
</style></head>
<body><div class="zoom" role="group" aria-label="Zoom"><button type="button" id="zm" aria-label="Diminuir">−</button><button type="button" id="za" aria-label="Ajustar à largura"><span id="zv">100%</span></button><button type="button" id="zp" aria-label="Aumentar">+</button></div>
<main id="paginas" aria-live="polite"><div class="sk" aria-hidden="true"></div></main>
<script type="module" src="previa.js"></script></body></html>
