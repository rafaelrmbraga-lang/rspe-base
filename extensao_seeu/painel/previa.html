<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia do documento</title>
<style>
  :root{--bg:#E9ECEE;--tx:#1E2226;--tx-2:#454B50}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 "Source Sans 3","Segoe UI",system-ui,sans-serif}
  #paginas{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  canvas{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .msg{padding:24px 16px;text-align:center;color:var(--tx-2)}
  .msg b{display:block;color:var(--tx);margin-bottom:4px}
  iframe{width:100%;height:100%;border:0;background:#fff}
  img{max-width:100%;display:block;margin:10px auto;background:#fff}
  .mais{margin:4px 0 14px;color:var(--tx-2);font-size:12px}
  .sk{width:calc(100% - 20px);max-width:620px;aspect-ratio:1/1.41;background:#fff;opacity:.6;margin:10px auto;animation:p 1.2s ease-in-out infinite alternate}
  @keyframes p{to{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head>
<body><main id="paginas" aria-live="polite"><div class="sk" aria-hidden="true"></div></main>
<script type="module" src="previa.js"></script></body></html>
