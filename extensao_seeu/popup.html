<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>APTO - RSPE do SEEU</title>
<style>
  :root{--pri:#1D5A3B;--pri2:#164A30;--tx:#1E2A24;--tx2:#5C6660;--tx3:#8E958F;--line:#DDE3DD;--bg:#F6F8F6;--r:#B42318;--rbg:#FBEAEA;--g:#1D5A3B;--gbg:#E8F2EC}
  *{box-sizing:border-box}
  body{margin:0;width:360px;font:13px/1.4 system-ui,"Segoe UI",Arial,sans-serif;color:var(--tx);background:#fff}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  header img{width:24px;height:24px}
  header b{font-family:Georgia,serif;font-size:15px;color:var(--pri);letter-spacing:.3px}
  header small{display:block;color:var(--tx3);font-size:11px}
  .liga{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);cursor:pointer}
  .liga input{width:30px;height:16px;accent-color:var(--pri);cursor:pointer}
  section{padding:10px 14px;border-bottom:1px solid var(--line)}
  label.t{display:block;font-size:11px;color:var(--tx2);margin-bottom:4px}
  select,input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--tx);background:#fff}
  .lin{display:flex;gap:6px;margin-top:6px}
  .lin input{flex:1}
  button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--tx);font:inherit;cursor:pointer}
  button:hover{border-color:var(--pri);color:var(--pri)}
  button.pri{background:var(--pri);border-color:var(--pri);color:#fff;width:100%;padding:8px}
  button.pri:hover{background:var(--pri2);color:#fff}
  .dica{font-size:11px;color:var(--tx3);margin-top:6px}
  .estado{margin-top:8px;padding:6px 8px;border-radius:6px;font-size:12px;display:none}
  .estado.ok{display:block;background:var(--gbg);color:var(--g)}
  .estado.erro{display:block;background:var(--rbg);color:var(--r)}
  ul{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto}
  li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
  li .q{color:var(--tx3);white-space:nowrap}
  li .e{color:var(--r)}
  li .m{color:var(--tx3)}
  .rod{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:11px;color:var(--tx3)}
  .chk{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--tx2)}
</style>
</head>
<body>
<header>
  <img src="icones/48.png" alt="">
  <div><b>APTO</b><small>RSPE do SEEU para a pasta vigiada</small></div>
  <label class="liga" title="Liga ou desliga o download automático"><input type="checkbox" id="ativo"> <span id="ativoTxt">ligada</span></label>
</header>

<section>
  <label class="t" for="base">Base de destino (subpasta)</label>
  <select id="base"></select>
  <div class="lin"><input type="text" id="nova" placeholder="Nome da base, igual ao do APTO" maxlength="80"><button id="add">Incluir</button></div>
  <div class="lin"><button id="rem" style="flex:1">Retirar a base escolhida da lista</button></div>
  <div class="dica" id="destino"></div>
</section>

<section>
  <button class="pri" id="agora">Baixar o RSPE do processo aberto</button>
  <div class="estado" id="estado"></div>
  <div class="dica">O automático baixa um RSPE por processo, base e dia, só do processo aberto na tela. Este botão baixa de novo mesmo que já tenha baixado hoje.</div>
</section>

<section>
  <label class="t" for="raiz">Pasta dentro de Downloads</label>
  <input type="text" id="raiz" maxlength="80">
  <label class="chk"><input type="checkbox" id="aviso"> Mostrar aviso discreto no SEEU quando salvar</label>
  <div class="dica">No APTO: menu da base &gt; "Pasta vigiada…" &gt; escolha <b id="dlRaiz">Downloads\APTO</b>. Cada subpasta entra na base de mesmo nome.</div>
</section>

<section>
  <label class="t">Últimos downloads <span id="hoje"></span></label>
  <ul id="log"></ul>
</section>

<div class="rod"><span id="pausa"></span><button id="limpar" title="Apaga o histórico de downloads guardado pela extensão (não apaga arquivos)">Limpar histórico</button></div>

<script src="popup.js"></script>
</body>
</html>
