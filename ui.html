<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RSPE Base</title>
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --line:#E6E9EF; --line2:#D0D5DD;
  --tx:#101828; --tx2:#475467; --tx3:#98A2B3;
  --pri:#00602C; --pri2:#004A22; --pri-soft:#E3F1E8;
  --r-bg:#FDE8E8; --r-tx:#B42318; --r-dot:#E5484D;
  --o-bg:#FFEAD5; --o-tx:#C4320A; --o-dot:#F97316;
  --a-bg:#FEF4D6; --a-tx:#B54708; --a-dot:#F5A524;
  --g-bg:#DDF5E7; --g-tx:#067647; --g-dot:#17B26A;
  --c-bg:#EEF0F3; --c-tx:#5B6470; --c-dot:#98A2B3;
  --b-bg:#DBEAFE; --b-tx:#1D4ED8; --b-dot:#2563EB;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --shadow2:0 12px 32px -8px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,sans-serif;font-size:13.5px;color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:10px;border:2px solid #fff}::-webkit-scrollbar-track{background:transparent}

/* topo */
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00602C,#0B7A3E);display:grid;place-items:center;box-shadow:var(--shadow)}
.logo svg{width:20px;height:20px}
.brand{line-height:1.1}.brand b{font-size:16px;letter-spacing:-.2px}.brand span{display:block;color:var(--tx3);font-size:11.5px;margin-top:2px}
.base{margin-left:8px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;border:1px solid var(--line);border-radius:999px;background:#FAFBFC;font-size:12.5px;color:var(--tx2)}
.base b{color:var(--tx)}.base .n{background:var(--pri-soft);color:var(--pri);padding:2px 8px;border-radius:999px;font-weight:600;font-size:12px}
.base button{padding:3px 8px;border-radius:999px;color:var(--tx2);font-size:12px}.base button:hover{background:#EEF0F3;color:var(--tx)}
.spacer{flex:1}
.search{position:relative}.search input{width:300px;padding:9px 12px 9px 36px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;transition:.15s}
.search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tx3)}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:6px;color:var(--tx3);display:none}
.search.has .x{display:block}.search .x:hover{background:#EEF0F3;color:var(--tx)}

/* barra de ações */
.bar{display:flex;align-items:center;gap:8px;padding:14px 24px 0;flex-wrap:wrap;row-gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line2);background:#fff;color:var(--tx);box-shadow:var(--shadow);transition:.15s}
.btn:hover{background:#F9FAFB;border-color:#B8C0CC}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn svg{width:16px;height:16px}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--tx2)}.btn.ghost:hover{background:#EEF0F3;color:var(--tx)}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.bar .btn,.bar .letra{flex:none;white-space:nowrap}.bar .sel{flex:none}.bar .sel select{text-overflow:ellipsis}
@media (max-width:1500px){.bar{gap:6px}.bar .btn{padding:9px 11px}.bar .btn.ghost{padding:9px 6px}.bar .sep{margin:0 2px}.bar .sel select{max-width:190px}}

/* abas */
.tabs{display:flex;gap:2px;padding:14px 24px 0;flex-wrap:wrap}
.tab{padding:9px 12px;border-radius:10px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;flex:none}
.tab svg{width:17px;height:17px;flex:none;color:#667085}.tab.on svg{color:var(--pri)}
.tab:hover{background:#EAECF0;color:var(--tx)}.tab.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.tesbar{display:flex;gap:14px;align-items:center;width:100%}.tesbar .search{flex:1;max-width:none}.tesbar input{width:100%}.tesfonte{white-space:nowrap}
.jz{display:grid;grid-template-columns:260px 1fr;height:100%}
.jz-side{border-right:1px solid var(--line);padding:14px 10px;overflow:auto;background:#FBFCFD}
.jz-h{margin:2px 8px 8px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--tx3);font-weight:600}
.jz-t{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.jz-t:hover{background:#F2F4F7;color:var(--tx)}.jz-t.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.jz-t i{width:8px;height:8px;border-radius:3px;flex:none}.jz-t span{flex:1;overflow:hidden;text-overflow:ellipsis}
.jz-t b{font-size:11px;font-weight:600;color:var(--tx3);background:#EEF0F3;border-radius:999px;padding:1px 7px}.jz-t.on b{background:#fff;color:var(--pri)}
.jz-main{overflow:auto;padding:14px 20px 20px}
.jz-head{display:flex;align-items:center;gap:10px;margin:0 2px 12px;font-size:12.5px;color:var(--tx3)}.jz-head b{color:var(--tx);font-size:14px}.jz-head .sp{flex:1}
.jz-sort{border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;background:#fff;color:var(--tx2);cursor:pointer}
.jz-c{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px 12px 22px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:.15s}
.jz-c:hover{border-color:#C9D1DB;box-shadow:0 4px 14px rgba(16,24,40,.07)}
.jz-c::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.jz-r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.jz-tema{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--fg)}
.jz-res{margin-left:auto;display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.jz-res.prov{background:#E8F5EE;color:#067647}.jz-res.mp{background:#EAF2FF;color:#1D4ED8}
.jz-dt{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.jz-tt{font-size:15px;font-weight:700;line-height:1.45;color:#101828;margin:2px 0 6px}
.jz-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--tx2);margin-bottom:10px}
.jz-meta span{display:inline-flex;align-items:center;gap:5px}.jz-meta svg{width:13px;height:13px;color:var(--tx3)}
.jz-kw{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.jz-kw span{font-size:11px;padding:2px 8px;border-radius:6px;background:#F2F4F7;color:#475467}
.jz-em{font-size:13px;line-height:1.6;color:#475467;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;border-left:2px solid #EAECF0;padding-left:12px;margin:0 0 10px}
.jz-em.on{display:block;white-space:pre-wrap}
.jz-ac{display:flex;align-items:center;gap:8px;border-top:1px solid #F2F4F7;padding-top:10px}.jz-ac .sp{flex:1}
.jz-lk{font-size:12.5px;font-weight:600;color:var(--pri);cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.jz-lk svg{width:15px;height:15px}
.jz-b{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer}
.jz-b:hover{border-color:var(--pri);color:var(--pri)}.jz-b.pri{background:var(--pri);border-color:var(--pri);color:#fff}.jz-b.pri:hover{color:#fff;background:var(--pri2)}.jz-b svg{width:14px;height:14px}
.jz-src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);white-space:nowrap}
.jz-src b{background:#E8F5EE;color:#067647;border-radius:6px;padding:2px 8px;font-size:11px}
.jz-f{cursor:pointer;background:#F2F4F7;color:#475467;border-radius:6px;padding:2px 8px;font-size:11px}.jz-f i{font-style:normal;opacity:.7}.jz-f.on{background:#E8F5EE;color:#067647;font-weight:600}
.jz-trib{font-size:11px;font-weight:600;color:#344054;background:#F2F4F7;border-radius:6px;padding:1px 7px}.jz-src s{text-decoration:none;background:#F2F4F7;color:#98A2B3;border-radius:6px;padding:2px 8px;font-size:11px}
.teses{padding:6px 16px 16px}.tescnt{padding:8px 2px 10px;font-size:12.5px}
.tese{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.tese .tt{font-weight:600;font-size:13.5px;line-height:1.4;margin-bottom:6px}.tese .tm{font-size:11.5px;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tese .te{font-size:12.5px;color:var(--tx2);line-height:1.5;white-space:pre-wrap;margin-bottom:8px}.tese .te.on{color:var(--tx)}
.mb.rz{border-left:3px solid var(--pri);background:#F6FBF8}.mb.rz .rzl{font-size:13px;line-height:1.5;padding:2px 0;font-weight:400;color:var(--tx)}.mb.rz .rzl.r0{font-weight:700}
.sd.alvo{border:2px solid var(--a-dot)!important;background:#FFF7E6}.alvo-txt{color:var(--a-tx);font-weight:600;font-size:12.5px;margin:4px 0}
table.rz{margin-top:8px;width:100%}table.rz td,table.rz th{font-size:12px;vertical-align:top}
.qd{border:1px solid var(--line);border-left:4px solid #98A2B3;border-radius:10px;background:#fff;padding:10px 14px;margin-top:6px}
.qd.verm{border-left-color:var(--r-dot)}.qd.amb{border-left-color:var(--a-dot)}.qd.verde{border-left-color:var(--g-dot)}
.qd .qr{display:flex;gap:12px;padding:4px 0;font-size:13.5px;line-height:1.45}.qd .qk{flex:0 0 170px;color:var(--tx2);font-weight:600}.qd .qv{flex:1;font-weight:400;color:var(--tx)}
.qd.verm .qr:first-child .qv{color:var(--r-tx)}.qd.amb .qr:first-child .qv{color:var(--a-tx)}
.qd .qa{margin-top:8px;padding:8px 10px;border-radius:8px;background:#FFF7E6;color:var(--a-tx);font-weight:600;font-size:12.5px}
.calc-full{display:none}.calc-full.on{display:block}
.ac-fund{margin-top:8px;border-top:1px dashed #e3e7ee;padding-top:6px}.ac-fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.ac-lista .ac-ft,.ac-ft{display:none;font-weight:400!important;white-space:pre-wrap;font-weight:400;color:var(--tx);font-size:12.5px;line-height:1.5;background:#f8faf9;border:1px solid #e3e7ee;border-radius:8px;padding:8px 10px;margin-top:6px}.ac-lista .ac-ft.on,.ac-ft.on{display:block}
.subtabs{display:none;gap:6px;padding:8px 24px 0;flex-wrap:wrap}.subtabs.on{display:flex}
.subtabs button{padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:12.5px;color:var(--tx2)}
.subtabs button:hover{border-color:var(--pri);color:var(--pri)}.subtabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.subtabs .muted{align-self:center;font-size:12px;margin-left:6px}
.tab .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:#EAECF0;color:var(--tx2)}.tab.on .cnt{background:var(--pri-soft);color:var(--pri)}

/* cartões de resumo */
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 24px 0}
.stat{flex:none;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.15s;font-size:12.5px}
.stat:hover{border-color:#B8C0CC}.stat.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.stat .dot{width:9px;height:9px;border-radius:50%;flex:none}
.stat b{font-size:14px;font-weight:700}.stat span{color:var(--tx2);font-size:12.5px}
.stat.velho{border-color:#F5C57A;background:#FFFAF0}.stat.velho .dot{background:#F79009}.stat.velho.on{border-color:#F79009;box-shadow:0 0 0 2px #FDEAD0}
.stats .info{padding:0 6px 0 0}
.rs-old{display:inline-flex;align-items:center;justify-content:center;margin-left:8px;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:800;background:#FFF1DB;color:#9A5B00;border:1px solid #F5C57A;vertical-align:1px;cursor:help;flex:none}
.letra{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:#fff;height:40px;padding:0 4px 0 12px;box-shadow:var(--shadow)}
.letra .lb{font-size:12px;color:var(--tx3);margin-right:6px;white-space:nowrap}
.letra button{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;border-radius:8px;font-weight:700;color:var(--tx)}
.letra button:hover{background:#F2F4F7}.letra button:disabled{color:#C0C6D0;background:none;cursor:default}.letra .s{font-size:12px}.letra .g{font-size:18px}
.copia{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx3);margin-left:6px;white-space:nowrap;cursor:pointer}.copia:hover{color:var(--tx)}
.copia i{width:8px;height:8px;border-radius:50%;background:var(--g-dot);display:inline-block}
.hbtn{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;font-weight:600;color:var(--tx2);background:#fff;cursor:pointer;margin-right:6px}
.hbtn:hover{border-color:var(--pri);color:var(--pri)}.hbtn svg{width:14px;height:14px}
table.hist{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;table-layout:fixed}table.hist td{overflow-wrap:anywhere}
table.hist th{text-align:left;color:var(--tx3);font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);position:static;background:none;cursor:default;vertical-align:bottom}
table.hist td{padding:7px 8px;border-bottom:1px solid #eef0f3;vertical-align:top;cursor:default;font-weight:400}table.hist td:first-child{color:var(--tx2);font-weight:600;white-space:nowrap}
table.hist td.mud{background:#FFF7E6;font-weight:700}table.hist tr:hover td{background:inherit}table.hist tr:hover td.mud{background:#FFF7E6}
table.hist .atual{display:inline-block;background:#E8F5EE;color:#067647;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;text-transform:none;margin-left:4px}
table.hist ul{margin:0;padding-left:16px}table.hist li{margin:1px 0}
.stat.vermelho .dot{background:var(--r-dot)}.stat.laranja .dot{background:var(--o-dot)}.stat.amarelo .dot{background:var(--a-dot)}.stat.vencido .dot{background:var(--r-dot)}.stat.verde .dot{background:var(--g-dot)}.stat.cinza .dot{background:var(--c-dot)}.stat.azul .dot{background:var(--b-dot)}.stat.neutro .dot{background:#CBD5E1}
.info{padding:12px 24px 0;color:var(--tx2);font-size:12.5px}

/* tabela */
.wrap{flex:1;min-height:0;padding:12px 24px 0}
.card{height:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:auto}
thead th{position:sticky;top:0;z-index:2;background:#F9FAFB;color:var(--tx2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:normal;line-height:1.25;vertical-align:bottom}
thead th:first-child{padding-left:14px}thead.exp th:first-child{padding-left:32px}thead th:hover{color:var(--tx)}
thead th .arr{opacity:.5;margin-left:4px;font-size:10px}
tbody td{padding:9px 12px;border-bottom:1px solid #F0F2F5;white-space:normal;overflow-wrap:anywhere;vertical-align:middle;line-height:1.35;font-size:13px}
tbody td:first-child{padding-left:14px;font-weight:600}td.nw,th.nw{white-space:nowrap;font-variant-numeric:tabular-nums}td.nw{max-width:320px;overflow:hidden;text-overflow:ellipsis}td.nw .pill{white-space:nowrap}td.pl .pill{overflow-wrap:normal;word-break:keep-all}
tbody tr{cursor:pointer;transition:background .1s}tbody tr:hover td{background:#F5F7FB}
/* linhas brancas: a cor fica só nas palavras (pílulas) e na barrinha lateral */
tbody tr.vermelho:hover td{background:#FFEFEF}tbody tr.laranja:hover td{background:#FFEFE3}tbody tr.amarelo:hover td{background:#FFF7E0}tbody tr.vencido:hover td{background:#FFEFEF}tbody tr.verde:hover td{background:#EAF8F0}
td.first{position:relative}td.first::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:transparent}
tr.vermelho td.first::before{background:var(--r-dot)}tr.laranja td.first::before{background:var(--o-dot)}tr.amarelo td.first::before{background:var(--a-dot)}tr.vencido td.first::before{background:var(--r-dot)}tr.verde td.first::before{background:var(--g-dot)}tr.cinza td.first::before{background:var(--c-dot)}
.pill{display:inline-flex;align-items:baseline;gap:6px;padding:0;border-radius:0;background:none!important;font-size:13px;font-weight:400;max-width:100%;white-space:normal;line-height:1.35}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;position:relative;top:-1px}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:7px;vertical-align:0;background:#98A2B3}.sdot.verm{background:var(--r-dot)}.sdot.amb{background:var(--a-dot)}.sdot.verde{background:var(--g-dot)}
.ptl .pill.verm::before,.ptl .pill.amb::before,.ptl .pill.verde::before{display:none}.ptl .pill{align-items:center}.ptl .pill .sdot{margin-right:0}
.pill.vermelho{background:var(--r-bg);color:var(--r-tx)}.pill.vermelho::before{background:var(--r-dot)}
.pill.laranja{color:var(--o-tx)}.pill.laranja::before{background:var(--o-dot)}
.pill.amarelo{background:var(--a-bg);color:var(--a-tx)}.pill.amarelo::before{background:var(--a-dot)}.pill.vencido{background:var(--r-bg);color:var(--r-tx)}.pill.vencido::before{background:var(--r-dot)}.pill.vencido{font-weight:400}
.pill.verde{background:var(--g-bg);color:var(--g-tx)}.pill.verde::before{background:var(--g-dot)}
/* situação neutra (cinza): escrita como as demais informações, sem bolinha */
.pill.cinza{color:var(--tx)}.pill.cinza::before{display:none}
.pill.none{color:var(--tx);font-weight:400}.pill.none::before{display:none}
.muted{color:var(--tx3)}.est{color:var(--tx2);font-size:11.5px}
.falta{color:var(--r-tx);font-weight:400}.falta::before,.apurar::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}.falta::before{background:var(--r-dot)}.apurar::before{background:var(--a-dot)}
tbody td>.muted,tbody td .fedit>.muted{color:var(--tx)}
.apurar{color:var(--a-tx);font-weight:400}
.empty{display:grid;place-items:center;height:100%;color:var(--tx3);text-align:center;padding:40px}
.empty b{display:block;color:var(--tx2);font-size:15px;margin-bottom:6px}

/* filtro de situação */
.sel{position:relative}.sel select{appearance:none;max-width:260px;padding:9px 34px 9px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;font:inherit;font-weight:600;color:var(--tx);outline:none;cursor:pointer}
.sel select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}.sel::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}

.det{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#F9FAFB}.det summary{cursor:pointer;font-weight:600;color:var(--tx2);font-size:12.5px}.det pre{white-space:pre-wrap;font:12px/1.5 Consolas,monospace;margin:8px 0 0;color:var(--tx)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-right:6px;background:#EEF0F3;color:var(--tx2)}
.tag.ok{background:var(--g-bg);color:var(--g-tx)}.tag.no{background:var(--r-bg);color:var(--r-tx)}.tag.pend{background:var(--a-bg);color:var(--a-tx)}

/* modal */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30}.modal.on{display:grid}
.box{width:440px;max-width:96vw;max-height:94vh;overflow:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow2);padding:22px 24px;animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.box h2{margin:0 0 4px;font-size:16px}.box p{margin:0 0 14px;color:var(--tx2);font-size:12.5px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}.chk:hover{background:#F5F7FB}
.chk input{width:16px;height:16px;accent-color:var(--pri)}
.box .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:-22px;z-index:3;background:var(--card);padding:10px 0 2px;margin-bottom:-2px;box-shadow:0 -8px 10px -8px rgba(16,24,40,.12)}
.help{font-size:13px;line-height:1.55;color:var(--tx2);max-height:60vh;overflow:auto}.box .acts{flex:none}.help h4{margin:14px 0 4px;color:var(--tx);font-size:13px}.help h4:first-child{margin-top:0}

/* tela inicial (sem base) */
.welcome{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:25}
.welcome.on{display:grid}
.wbox{width:560px;background:var(--card);border-radius:18px;box-shadow:var(--shadow2);padding:28px 30px}
.wbox h1{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}.wbox p{margin:0 0 18px;color:var(--tx2)}
.wrow{display:flex;gap:8px;margin-bottom:10px}.wrow input{flex:1;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;font:inherit;outline:none}
.wrow input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.recent{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.recent div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.recent div:last-child{border-bottom:0}.recent div:hover{background:#F5F7FB}.recent small{color:var(--tx3)}
.wfoot{margin-top:14px;color:var(--tx3);font-size:12px}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#101828;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:40;box-shadow:var(--shadow2);max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.menu{position:absolute;top:44px;left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow2);padding:6px;display:none;z-index:15;min-width:200px}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}.menu button:hover{background:#F5F7FB}
.rel{position:relative}
.ln{display:flex;gap:12px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--ln,#EEF0F3)}
.ln:last-child{border-bottom:0}.ln .lr{flex:0 0 118px;color:var(--tx3,#667085);font-size:12.5px;padding-top:2px}.ln .lv{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pts{margin:0;padding-left:0;list-style:none}.pts li{padding:5px 0 5px 12px;border-left:3px solid #CBD5E1;margin-bottom:4px}.pts li.alerta{border-color:var(--r-dot,#E5484D)}.pts li.verificar{border-color:var(--a-dot,#F5A524)}
.subtab .par{margin:0 0 6px}.subtab .par:last-child{margin-bottom:0}
.det{margin-bottom:10px}
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:2px 0 12px}.ac-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ac-lista{display:grid;gap:10px}
.ac{background:#fff;border:1px solid var(--line);border-left:4px solid #CBD5E1;border-radius:10px;padding:12px 16px}
.ac.alerta{border-left-color:var(--r-dot)}.ac.verificar{border-left-color:var(--a-dot)}.ac.ok{border-left-color:var(--g-dot)}.ac.info{border-left-color:#CBD5E1}.ac.bx{opacity:.6}
.ac-h{display:flex;align-items:center;gap:10px}.ac-h b{font-size:13.5px;color:var(--tx);font-weight:600;flex:1}.ac-a{margin-left:auto}
.ac-d{margin:8px 0 0;max-width:1100px}.ac-d p{margin:0 0 5px;font-size:12.8px;line-height:1.6;color:var(--tx);font-weight:400}
.ac-f{margin-top:6px;font-size:11.5px;color:var(--tx3);font-weight:400}.ac-top .muted{font-weight:400}
.fdt{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fdt th{background:#F8F9FB;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);position:static}
.fdt td{padding:8px 12px!important;font-size:12.5px;line-height:1.45;border-bottom:1px solid #F0F1F3;white-space:normal;font-weight:400!important;height:auto}
.fdt tr.fdb td{font-weight:600!important}.fdt tr.fdb td .n{font-weight:400!important}
.fdt tr.fdb td{background:#F8F9FB;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 12px;font-weight:600}
.fdt tr.fdb td .n{color:var(--tx2);font-weight:400}
.fdt tr.fdi td:first-child{padding-left:30px!important}
.fdt tr.fdi:hover td{background:#EEF6F0}
.fdt tr.ok td{color:var(--tx3)}.fdt tr.ok .pill{opacity:.55}
.fdt .c{text-align:center}
.tk{width:20px;height:20px;border-radius:50%;border:2px solid #D0D5DD;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle;box-sizing:border-box;background:#fff}
.tk:hover{border-color:var(--g-dot)}
.tk.on{background:var(--g-dot);border-color:var(--g-dot)}.tk.on::after{content:"✓";color:#fff;font-size:12px;font-weight:700;line-height:1}

/* edição dos dados da prescrição (preencher ou corrigir) e triagem do saldo */
.pf{border:1px solid #D0D5DD;border-radius:10px;background:#FCFCFD;padding:10px 12px;margin:6px 0;font-size:12px}
.pf h5{margin:0 0 8px;font-size:12.5px}.pf .muted{font-size:11.5px}
.pf-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px}
.pf label{display:flex;flex-direction:column;gap:3px;color:var(--tx2);font-weight:600;font-size:11.5px}
.pf input,.pf select{font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--tx)}
.pf input.ed,.pf select.ed{background:#FEF4D6;border-color:#F5A524}
.pf-volta{float:right;font-weight:600;font-size:11px;color:#175CD3;cursor:pointer;margin-left:6px}
.pf-volta:hover{text-decoration:underline}
.pf .sd{margin-top:10px;padding:8px 10px;border:1px dashed #F5A524;border-radius:8px;background:#FFFAEB}
.pf .sd .amd{display:flex;gap:6px;align-items:center;margin-top:4px}.pf .sd .amd input{width:62px}
.pf .acts{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.btn-sal{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;background:#F79009;color:#fff;font-weight:700;font-size:11px;cursor:pointer;letter-spacing:.3px}
.btn-sal:hover{background:#DC6803}
.aj{color:#B54708;font-size:11px;font-weight:600;margin-left:4px}
.ptl-res .tri{margin-top:4px;font-weight:600}.ptl-res .sr{margin-top:3px;color:var(--tx2);font-size:12px}
/* linha do tempo de indulto e comutação */
.tlv{position:fixed;inset:0;z-index:35;background:rgba(16,24,40,.45);display:none}
.tlv.on{display:block}
.tlv-in{position:absolute;inset:14px;background:var(--bg);border-radius:14px;box-shadow:var(--shadow2);display:flex;flex-direction:column;overflow:hidden}
.tlv-top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)}
.tlv-top h2{margin:0;font-size:16px}.tlv-top .sub{color:var(--tx2);font-size:12px}.tlv-top .sp{flex:1}
.tlv-body{flex:1;overflow:auto;padding:14px 18px 40px;display:flex;flex-direction:column;gap:14px}
.tlv-sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.tlv-sec>h3{margin:0 0 10px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:10px}
.tlv-sec>h3 .sp{flex:1}
.tlv-dec{display:flex;gap:6px;flex-wrap:wrap}
.tlv-dec button{padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12px;font-weight:600;color:var(--tx2)}
.tlv-dec button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tlv-sep{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:6px;align-items:stretch}
.tlv-sep .bx{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#F9FAFB;font-size:12px;color:var(--tx2)}
.tlv-sep .bx b{display:block;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--tx);margin-bottom:3px}
.tlv-sep .bx .v{font-size:15px;font-weight:700;color:var(--tx)}
.tlv-sep .bx.main{border-color:#A6F4C5;background:#ECFDF3}.tlv-sep .bx.out{opacity:.8;border-style:dashed}
.tlv-sep .ar{display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:18px}
.crs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.cr{border:1px solid var(--line);border-radius:10px;padding:9px 11px 10px;background:#fff;border-top:4px solid var(--c);font-size:12px;line-height:1.45;cursor:pointer}
.cr:hover{box-shadow:var(--shadow)}
.cr .tg{display:inline-block;background:var(--c);color:#fff;font-weight:700;border-radius:5px;padding:1px 7px;margin-right:6px;font-size:11.5px}
.cr .pr{font-weight:600;font-variant-numeric:tabular-nums}.cr .tp{color:var(--tx);font-weight:600;margin-top:3px}.cr .mu{color:var(--tx2)}
.dbbox{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.dbbox small{display:block;color:var(--tx3);font-size:11.5px;margin-bottom:2px}
.dbbox .dbm{color:var(--tx2)}.dbbox.vermelho{border-color:var(--r-dot);background:var(--r-bg)}.dbbox.vermelho .dbm{color:var(--r-tx)}.dbbox.amarelo{border-color:var(--a-dot);background:var(--a-bg)}.dbbox.amarelo .dbm{color:var(--a-tx)}
.selo{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 8px;border-radius:6px;font-weight:700;font-size:11.5px}
.selo.IMPEDITIVO{background:#FDE8E8;color:#B42318}.selo.NAO_IMPEDITIVO{background:#DDF5E7;color:#067647}.selo.A_VERIFICAR{background:#FEF4D6;color:#B54708}.selo.FORA{background:#EEF0F3;color:#5B6470}
.tlv-bar svg,.tlv-tl svg{display:block}
.tlv-tl{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#FCFCFD}
.tlv .ck{cursor:pointer}.tlv .ck:hover{opacity:.8}
.tlv-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--tx2);margin-top:8px}
.tlv-leg i{display:inline-block;width:22px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.decs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}.decs.um{grid-template-columns:1fr}.decs.um .dc{display:grid;grid-template-columns:1fr 1fr;font-size:13px}.decs.um .dc-h{grid-column:1/-1}.decs.um .dc-s:first-of-type{border-right:1px solid #F0F1F3}
.dc{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;font-size:12px}
.dc.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.dc-h{padding:9px 12px;background:#F8F9FB;border-bottom:1px solid var(--line)}
.dc-h b{font-size:13px}.dc-h .mu{color:var(--tx2);font-size:11.5px}
.dc-s{padding:8px 12px;border-bottom:1px solid #F0F1F3}
.dc-s .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--tx2);margin-bottom:6px}
.dc-g{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;font-variant-numeric:tabular-nums}
.dc-g .k{color:var(--tx2)}.dc-g .v{font-weight:600}
.cl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.cl li{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:start;line-height:1.4}
.cl .ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.cl .ok .ic{background:#17B26A}.cl .ko .ic{background:#E5484D}.cl .q .ic{background:#F5A524}
.cl .it{font-weight:600}.cl .tx{color:var(--tx2);display:block;font-weight:400}
.hw{color:var(--pri);cursor:pointer;font-size:10.5px;font-weight:800;width:17px;height:17px;border-radius:50%;border:1px solid var(--pri-soft);display:inline-flex;align-items:center;justify-content:center;opacity:.7}.hw:hover{opacity:1;background:var(--pri-soft)}
.cpf{margin-left:auto;border:1px solid var(--line2);background:#fff;color:var(--pri);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}.cpf:hover{background:var(--pri-soft)}
.tlv-sum{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end}.tlv-sum>div{display:flex;flex-direction:column}.tlv-sum .k{font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;font-weight:600}.tlv-sum .v{font-size:16px;font-weight:700;color:var(--tx)}.tlv-sum .m .v{color:#067647}
.stt{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:700;font-size:11px}
.stt.cabe{background:#DDF5E7;color:#067647}.stt.nao{background:#FDE8E8;color:#B42318}.stt.verificar{background:#FEF4D6;color:#B54708}.stt.ainda{background:#DBEAFE;color:#1D4ED8}.stt.prejudicada{background:#EEF0F3;color:#5B6470}.stt.concedido{background:#DBEAFE;color:#1D4ED8}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rc{border-radius:10px;padding:10px 12px;border-left:5px solid;font-size:12px;line-height:1.5}
.rc b{display:block;font-size:12.5px;letter-spacing:.3px}.rc .mu{color:var(--tx2);font-size:11.5px}
.rc.cabe{background:#ECFDF3;border-color:#17B26A}.rc.nao{background:#FEF3F2;border-color:#E5484D}.rc.verificar{background:#FFFAEB;border-color:#F5A524}.rc.ainda,.rc.concedido{background:#EFF8FF;border-color:#2563EB}.rc.prejudicada{background:#F9FAFB;border-color:#98A2B3}
.rc .pj{margin-top:6px;padding:6px 8px;border-radius:6px;background:#fff;border:1px dashed #2563EB;color:#1D4ED8;font-weight:600}
.tlv-det{position:absolute;top:62px;right:14px;width:390px;max-height:calc(100% - 80px);overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow2);padding:12px 14px;display:none;font-size:12px;z-index:3}
.tlv-det.on{display:block}
.tlv-det h4{margin:0 26px 8px 0;font-size:13px}.tlv-det .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--tx3);font-size:15px}
.tlv-det dl{margin:0;display:grid;grid-template-columns:118px 1fr;gap:6px 10px}.tlv-det dt{color:var(--tx2);font-weight:600}.tlv-det dd{margin:0;line-height:1.45}
.tlv-det .calc{font-family:ui-monospace,Consolas,monospace;background:#F8F9FB;border-radius:6px;padding:4px 6px}
.duv{display:flex;flex-direction:column;gap:5px}
.duv div{background:#FFFAEB;border:1px solid #FEDF89;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}

.fixbar{display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 24px 0;font-size:12px;color:var(--tx3)}.fixbar.on{display:flex}
.fixbar .fx{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:#FFF8E6;border:1px solid #F5D08A;color:#7A4A00;font-weight:700;cursor:pointer}
.fixbar .fx.on{background:#FDB022;color:#fff;border-color:#FDB022}.fixbar .fx b{font-weight:400;opacity:.7;padding:0 4px;border-radius:50%}.fixbar .fx b:hover{opacity:1;background:rgba(0,0,0,.08)}
.calcn{margin:8px 0 2px;padding:7px 10px;border-radius:8px;background:#F9FAFB;border-left:3px solid #98A2B3;font-size:12px;color:var(--tx2)}
.nmc{display:inline-flex;align-items:flex-start;gap:2px;min-width:230px}.nmc .pin{flex:none;margin-top:-1px;vertical-align:0}
.pin{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:6px;color:#98A2B3;cursor:pointer;margin-right:4px;vertical-align:-4px;opacity:.7;transition:.12s}
tr:hover .pin{opacity:1}.pin:hover{background:#F2F4F7;color:#B54708}.pin.on{opacity:1;color:#F79009}.pin svg{width:14px;height:14px}
tbody tr.fix td{background:#FFFCF2}
.fico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;color:#C4CAD4;vertical-align:middle;margin-left:4px}.fico.ok{color:#12B76A}.fico svg{width:16px;height:16px}
tr.noclk{cursor:default}
.qbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--tx3);cursor:pointer;margin-left:4px;vertical-align:middle}.qbtn:hover{border-color:var(--pri);color:var(--pri)}.qbtn svg{width:14px;height:14px}
.qd-board{display:flex;gap:14px;align-items:flex-start;padding:16px;height:100%;overflow:auto}
.qd-col{flex:0 0 300px;background:#F2F4F7;border-radius:14px;padding:10px;display:flex;flex-direction:column;max-height:100%}
.qd-col.drag{outline:2px dashed var(--pri);outline-offset:-2px;background:#E8F5EE}
.qd-ch{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}.qd-ch b{font-size:13px;flex:1;cursor:text}.qd-ch span{font-size:11.5px;color:var(--tx3);background:#fff;border-radius:999px;padding:1px 8px;font-weight:700}
.qd-list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:40px;padding-bottom:4px}
.qd-card{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(16,24,40,.08);border:1px solid #EAECF0;cursor:grab;border-left:4px solid var(--et,#EAECF0)}
.qd-card:hover{border-color:#C9D1DB}.qd-card.arr{opacity:.4}
.qd-card .t{font-weight:700;font-size:13px;line-height:1.35;color:#101828}.qd-card .a{font-size:12px;color:var(--pri);font-weight:600;margin-top:3px;cursor:pointer}.qd-card .a small{color:var(--tx3);font-weight:400}
.qd-card .o{font-size:12px;color:var(--tx2);margin-top:5px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qd-card .f{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.qd-pz{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F2F4F7;color:#475467}
.qd-pz.venc{background:#FDE8E8;color:#B42318}.qd-pz.prox{background:#FEF4D6;color:#B54708}
.qd-ben{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#EEF4FF;color:#3538CD}

<script>
const API_ = () => (window.pywebview && window.pywebview.api) || window.__mockApi;
// resposta parcial (só os assistidos alterados): troca-os na lista que a tela já tem, sem recarregar a base inteira
function mesclar(r){ if(!r || !r.parcial) return r; const regs=(ui.dados.registros||[]).slice();
  if(r.removido) { const i=regs.findIndex(x=>x.id===r.removido); if(i>=0) regs.splice(i,1); }
  r.parcial.forEach(n=>{ const i=regs.findIndex(x=>x.id===n.id); if(i>=0) regs[i]=n; else regs.push(n); });
  const o=Object.assign({}, ui.dados, r, {registros:regs}); delete o.parcial; delete o.removido; if(!('msg' in r)) delete o.msg; return o; }
const API = () => { const b=API_(); if(!b) return b; return new Proxy(b,{get:(t,k)=>typeof t[k]==='function' ? (...a)=>Promise.resolve(t[k](...a)).then(mesclar) : t[k]}); };
const MODELOS_ATIVOS = false; // petições a partir de modelos .docx: desativadas por ora (foco na matemática)
async function api(m, ...a){ try{ const r = await API()[m](...a); if(r && r.registros) ui.carregar(r); else if(r && r.erro) ui.toast(r.erro); else if(r && r.msg) ui.toast(r.msg); return r; }catch(e){ ui.toast('Erro: '+e); } }

const ui = {
  dados:{registros:[],abas:[],base:'',hoje:''}, aba:'geral', filtro:'', filtroCor:null, filtroSel:'todas', ordem:{}, sel:null, aberto:null,
  carregar(d){ this.dados=d; const w=document.getElementById('welcome');
    if(this.aberto){ const ra=(d.registros||[]).find(x=>x.id===this.aberto); if(ra&&ra._leve) setTimeout(()=>this.completo(ra.id),0); }
    if(d.sem_base){ w.classList.add('on'); document.getElementById('copia').innerHTML=''; document.getElementById('baseNome').textContent='—'; document.getElementById('baseN').textContent='0';
      document.getElementById('recentes').innerHTML=(d.recentes||[]).map(r=>`<div onclick="api('abrir_base','${esc(r.caminho).replace(/\\/g,'\\\\')}')"><span>${esc(r.nome)}</span><small>${esc(r.caminho)}</small></div>`).join('')||'<div style="cursor:default;color:var(--tx3)">Nenhuma base recente</div>';
      document.getElementById('wfoot').textContent='Base jurídica '+(d.base_juridica?d.base_juridica.versao:'?')+' · '+d.hoje; this.dados.registros=[]; this.render(); return; }
    w.classList.remove('on'); if(d.base!==this._qdBase){ this._qdBase=d.base; this._qd=null; this.qdCarregar().then(()=>this.render()); } document.getElementById('baseNome').textContent=d.base; document.getElementById('baseN').textContent=d.registros.length;
    document.getElementById('copia').innerHTML=d.copia?`<i></i>cópia de segurança: ${esc(d.copia.quando)}`:'';
    document.getElementById('hoje').textContent='Hoje '+d.hoje+(d.base_juridica?' · base jurídica '+d.base_juridica.versao:''); if(!this.dados.abas.concat(this.ABAS_EXTRA).find(a=>a.id===this.aba)) this.aba='geral'; this.render(); },
  async criarBase(){ const n=document.getElementById('novoNome').value.trim(); if(!n) return this.toast('Dê um nome à base.'); await api('nova_base', n); },
  prescModo:'pe',
  // sub-abas da aba Indulto / Comutação: um decreto por vez (colunas, cores, contagem e linha do tempo só dele)
  indDec:'todos',
  IND_DEC:[{id:'2022',k:['i22'],r:'Decreto 11.302/2022'},{id:'2024',k:['i24','c24'],r:'Decreto 12.338/2024'},{id:'2025',k:['i25','c25'],r:'Decreto 12.790/2025'}],
  irDec(id){ this.indDec=id; this.filtroCor=null; this.aberto=null; this.render(); },
  spec(){ const a=this.dados.abas.find(x=>x.id===this.aba); if(a&&a.id==='ind'&&this.indDec!=='todos'){ const D=this.IND_DEC.find(x=>x.id===this.indDec); if(D){
      const b=Object.assign({},a); b.cols=a.cols.filter(c=>['nome','proc','imp','pedido'].includes(c[0])||D.k.includes(c[0])).map(c=>D.k.includes(c[0])?[c[0],c[1],24]:c);
      b.cor=D.k[0]+'_cor'; b.pilulas={}; Object.keys(a.pilulas).forEach(k=>{ if(k==='imp'||D.k.includes(k)) b.pilulas[k]=a.pilulas[k]; });
      b.filtros=(a.filtros||[]).filter(f=>!/^b:/.test(f[0])||D.k.some(k=>f[0].startsWith('b:'+k+':'))); return b; } }
    if(!a||a.id!=='presc') return a;
    // prescrição: uma pretensão por vez (executória ou punitiva)
    const pe=this.prescModo!=='pp'; const b=Object.assign({},a);
    b.cols=a.cols.filter(c=>['nome','proc'].includes(c[0])).concat(pe?[['presc_ppe','Pretensão executória',16],['presc_prox','Prescrição em',10],['presc_calc','Cálculo da fuga',9]]:[['presc_retro','Pretensão punitiva',16]]).concat(a.cols.filter(c=>c[0]==='pedido'));
    b.cor=pe?'presc_ppe_cor':'presc_retro_cor'; b.legenda=pe?'presc':'presc_pp';
    b.pilulas=pe?{presc_ppe:'presc_ppe_cor'}:{presc_retro:'presc_retro_cor'};
    const base=a.sub_cols.filter(c=>['crime','proc_crim','pena','fato','denuncia','sentenca','transito'].includes(c[0]));
    b.sub_cols=base.concat(a.sub_cols.filter(c=>pe?['prazo_ppe','ppe_termo','ppe_status'].includes(c[0]):['prazo_ppp','retro_status'].includes(c[0])));
    b.sub_pilulas=pe?{ppe_status:'ppe_cor'}:{retro_status:'retro_cor'};

      svg+=`<g class="ck" onclick="ui.tlvDet(${di})"><line x1="${xx}" y1="${yA}" x2="${xx}" y2="${ly-10}" stroke="${c}" stroke-width="1" opacity=".7"/><circle cx="${xx}" cy="${yA}" r="6" fill="#fff" stroke="${c}" stroke-width="2.5"/>${duv?`<text x="${xx}" y="${yA-9}" text-anchor="middle" font-size="12">⚠</text>`:''}
        <text x="${fim?xx-4:xx+4}" text-anchor="${fim?'end':'start'}" y="${ly}" font-size="11" fill="#667085">${esc(G.data)} · <tspan font-weight="700" fill="${c}">${esc(rot)}</tspan></text></g>`; });
    const H=yA+70+Math.max(1,niveis.length)*21+10;
    const linha=`<div class="tlv-tl"><svg width="100%" viewBox="0 0 ${TW} ${H}" preserveAspectRatio="xMinYMin meet">${defs}${svg}</svg></div>
      <div class="tlv-leg"><span><i style="background:#17B26A"></i>período cumprido (cumprimento, detração e livramento; a remição entra no total)</span><span><i style="background:#fff;border:1px solid #D0D5DD"></i>fora do cumprimento (fuga, liberdade)</span>${J?'<span><i style="background:rgba(240,68,56,.12);border:1px dashed rgba(240,68,56,.5)"></i>janela da falta grave do decreto</span>':''}${D.imputacao?'<span><i style="background:repeating-linear-gradient(135deg,rgba(16,24,40,.45) 0 2px,transparent 2px 8px);border:1px solid #475467"></i>cumprido imputado ao impeditivo</span>':''}<span><span class="sdot" style="background:#E5484D"></span>falta na janela</span><span><span class="sdot" style="background:#98A2B3"></span>falta fora da janela (sem efeito)</span><span style="color:#B54708">⚠ falta sem homologação</span></div>`;
    // 4-6. cartões dos decretos com checklist
    const ico={ok:'✔',ko:'✖',q:'?'};
    // a falta do art. 6º já aparece no requisito subjetivo; incisos não atendidos só pelos números (detalhe no "?")
    const lista=(ck,pref)=>`<ul class="cl">${(ck||[]).filter(c=>!(c.item!=='Requisito subjetivo'&&!c.item.startsWith('Requisito subjetivo')&&/^(FALTA nos|Art\. 6º)/.test(c.texto||'')&&(ck||[]).some(z=>z.item.startsWith('Requisito subjetivo')&&z.estado==='ko'))).map(c=>{ const di=this.tlvReg(`${pref} - ${c.item}`, Object.assign({}, c.det, {efeito:(c.det&&c.det.efeito)||c.texto})); return `<li class="${c.estado}"><span class="ic">${ico[c.estado]}</span><span><span class="it">${esc(/^Não atendidos:/.test(c.texto||'')?'Hipóteses não atendidas':c.item)}</span><span class="tx">${/^Não atendidos:/.test(c.texto||'')?'Incisos '+esc([...c.texto.matchAll(/(?:: |; )([IVX]+(?: e [IVX]+)?) \(/g)].map(m=>m[1]).join(', '))+' <span class="muted">(motivo de cada um no ?)</span>':penaExt(esc(c.texto))}</span></span><span class="hw" title="Como cheguei aqui?" onclick="ui.tlvDet(${di})">?</span></li>`; }).join('')}</ul>`;
    const decs=(d.decretos||[]).filter(vis).map(x=>{ const i=x.indulto||{}, c=x.comutacao||{}; const oi=(i.checklist||[])[0]||{};
      const gi=i.cumprido_txt?`<div class="dc-g"><span class="k">Pena considerada</span><span class="v">${penaExt(esc(i.pena_considerada_txt||''))}${i.reinc?' · '+esc(i.reinc):''}</span><span></span><span class="k">Cumprido na data</span><span class="v" title="${esc(i.fonte||'')}">${penaExt(esc(i.cumprido_txt))}</span><span></span><span class="k">Remanescente</span><span class="v">${penaExt(esc(i.remanescente_txt||''))}</span><span></span>${i.projecao&&i.projecao.data?`<span class="k">Projeção</span><span class="v">${esc(i.projecao.hipotese)}: exige ${penaExt(esc(i.projecao.exigido_txt))} → ${esc(i.projecao.data)}</span><span></span>`:''}</div>`:'';
      const gc=c.exigido!=null?`<div class="dc-g"><span class="k">Requisito objetivo</span><span class="v">${esc(c.fracao||'')}</span><span></span><span class="k">Exigido</span><span class="v">${penaExt(esc(c.exigido_txt||''))}</span><span></span>${c.reducao?`<span class="k">Redução</span><span class="v">${esc(c.reducao.fracao)} de ${penaExt(esc(this.sqFmt(c.reducao.base_dias)))} = ${penaExt(esc(c.reducao.reducao_txt))}</span><span></span><span class="k">Remanescente</span><span class="v">${penaExt(esc(c.reducao.antes_txt))} → ${penaExt(esc(c.reducao.depois_txt))}</span><span></span>`:''}</div>`:'';
      return `<div class="dc ${x.id===this._tlvDec?'sel':''}" id="dc_${x.id}"><div class="dc-h"><b>DECRETO Nº ${esc(x.numero)}</b> <span class="mu">· data de referência ${esc(x.referencia)}${x.publicacao?' · publicação '+esc(x.publicacao):''}</span>${x.nota?`<div class="mu" style="margin-top:2px;text-transform:none;letter-spacing:0;font-weight:400">${esc(x.nota)}</div>`:''}</div>
        <div class="dc-s"><div class="t">Indulto <span class="stt ${i.status}">${esc(i.rotulo||'')}</span>${i.fundamentacao?`<button class="cpf" onclick="ui.copiarClip(${this.clip(i.fundamentacao)})" title="Copia o texto corrido da análise para colar na petição">⧉ Copiar fundamentação</button>`:''}</div>${gi}${lista(i.checklist,'Indulto '+x.numero)}</div>
        <div class="dc-s"><div class="t">Comutação <span class="stt ${c.status}">${esc(c.rotulo||'')}</span>${c.fundamentacao?`<button class="cpf" onclick="ui.copiarClip(${this.clip(c.fundamentacao)})" title="Copia o texto corrido da análise para colar na petição">⧉ Copiar fundamentação</button>`:''}</div>${gc}${lista(c.checklist,'Comutação '+x.numero)}</div></div>`; }).join('');
    const expl=(d.decretos||[]).filter(vis).map(x=>{ const ei=this.tlvExpl(x.indulto,todos,'Indulto'), ec=this.tlvExpl(x.comutacao,todos,'Comutação'); return (ei||ec)?`<div class="dc ${x.id===this._tlvDec?'sel':''}"><div class="dc-h"><b>DECRETO Nº ${esc(x.numero)}</b> <span class="mu">· data de referência ${esc(x.referencia)}</span></div><div class="dc-s">${ei}</div><div class="dc-s">${ec}</div></div>`:''; }).join('');
    // 10. resultado final
    const numVis=new Set((d.decretos||[]).filter(vis).map(x=>x.numero)); const res=(d.resultado||[]).filter(k=>numVis.has(k.decreto)).map(k=>`<div class="rc ${k.status}"><b>${esc(k.titulo)}</b><div class="mu">${k.tipo==='indulto'?'Indulto':'Comutação'} · Decreto ${esc(k.decreto)}</div>${(k.linhas||[]).map(l=>`<div>${penaExt(esc(l))}</div>`).join('')}${k.projecao?'<div class="pj">Projeção baseada nos requisitos do último decreto publicado; depende de o próximo decreto repetir as mesmas condições.</div>':''}</div>`).join('');
    const duv=(d.duvidas||[]).length?`<div class="tlv-sec"><h3>⚠ A verificar (nada foi presumido)</h3><div class="duv">${d.duvidas.map(q=>`<div>${q.data?'<b>'+esc(q.data)+'</b> · ':''}${esc(q.texto)}</div>`).join('')}</div></div>`:'';
    document.getElementById('tlv').innerHTML=`<div class="tlv-in"><div class="tlv-top"><div><h2>Indulto e comutação · linha do tempo</h2><div class="sub">${esc(d.nome)} · ${esc(d.proc)} · ${pl((d.crimes||[]).length,'crime','crimes')} numa linha só (LEP, art. 111) · clique em qualquer elemento para ver "Como cheguei aqui?"</div></div><span class="sp"></span><div class="tlv-dec">${decBt}</div><button class="btn" onclick="ui.fecharTLV()">Fechar</button></div>
      <div class="tlv-body">
        <div class="tlv-sec"><h3>1 · Crimes <span class="muted" style="text-transform:none;letter-spacing:0">selo pelo Decreto ${esc(Dsel.numero||'')}</span></h3><div class="crs">${crs}</div></div>
        ${duv}
        <div class="tlv-sec"><h3>2 · Resultado</h3><div class="res">${res}</div></div>
        <details class="tlv-sec dobra" ${(this._tlvAbre||{}).cmp?'open':''} ontoggle="(ui._tlvAbre=ui._tlvAbre||{}).cmp=this.open"><summary><h3>3 · ${todos?'Decretos':'Decreto '+esc(D.numero||'')}: comparativo com os incisos (exigido × cumprido na data de referência)</h3></summary><div class="decs ${todos?'':'um'}">${decs}</div></details>
        ${expl?`<details class="tlv-sec dobra" ${(this._tlvAbre||{}).expl?'open':''} ontoggle="(ui._tlvAbre=ui._tlvAbre||{}).expl=this.open"><summary><h3>4 · Como cheguei aqui</h3></summary><div class="decs ${todos?'':'um'}">${expl}</div></details>`:''}
      </div><div class="tlv-det" id="tlvDet"></div></div>`; },
  fecharModal(){ document.getElementById('modal').classList.remove('on'); },
  async exportar(fmt){ const ids=[...document.querySelectorAll('#modal input:checked')].map(i=>i.value); if(!ids.length) return this.toast('Marque ao menos uma aba.');
    this.fecharModal(); const vis=this.visiveis().map(r=>r.id); const r=await API().exportar(fmt, ids, vis);
    if(r && r.caminho){ this.toast('Exportado: '+r.caminho); } else if(r && r.erro){ this.toast(r.erro); } },
  async modelos(){ const info=await API().modelos_info(); if(!info){ return; }
    const lista=(info.modelos||[]).map(m=>`<div class="chk" style="justify-content:space-between;cursor:default"><span><b>${esc(m.nome.replace(/\.docx$/i,''))}</b> <span class="muted">· ${esc(m.modificado)} · ${pl(m.campos,'campo','campos')}${m.desconhecidos&&m.desconhecidos.length?' · <span style="color:var(--r-tx)">campos desconhecidos: '+esc(m.desconhecidos.join(', '))+'</span>':''}</span></span>
        <span style="white-space:nowrap"><span class="mini" onclick="ui.modeloAcao('abrir','${esc(m.nome)}')" title="Abre no Word para editar; salve e feche">Editar</span> <span class="mini" onclick="ui.modeloAcao('substituir','${esc(m.nome)}')">Substituir</span> <span class="mini" onclick="ui.modeloAcao('renomear','${esc(m.nome)}')">Renomear</span> <span class="mini" style="color:var(--r-tx)" onclick="ui.modeloAcao('excluir','${esc(m.nome)}')">Excluir</span></span></div>`).join('')||'<p class="muted">Nenhum modelo ainda.</p>';
    document.getElementById('modal').innerHTML=`<div class="box" style="width:720px;max-height:calc(100vh - 40px);display:flex;flex-direction:column"><h2>Modelos de petição (.docx)</h2>
      <p class="muted" style="margin:0 0 8px">Pasta: ${esc(info.pasta)}. Escreva os campos no Word como {{nome}}, {{processo}}, {{vara}}… (lista completa no CAMPOS.txt ou em "Ver campos").</p>
      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><button class="btn pri" onclick="ui.modeloAcao('adicionar')">Adicionar modelos…</button><button class="btn" onclick="ui.modeloAcao('novo')">Criar modelo em branco…</button><button class="btn" onclick="ui.modeloAcao('pasta')">Abrir pasta</button><button class="btn" onclick="ui.modeloAcao('campos')">Ver campos</button><button class="btn" onclick="ui.modeloAcao('restaurar')" title="Recoloca os modelos da unidade que foram excluídos, sem alterar os existentes">Restaurar modelos da unidade</button></div>
      <div class="help" style="flex:1;min-height:100px;overflow:auto">${lista}</div>
      <div class="acts"><button class="btn pri" onclick="ui.fecharModal()">Fechar</button></div></div>`; document.getElementById('modal').classList.add('on'); },
  async modalVigia(r){ r=r||await API().vigia_info(); if(!r) return; if(r.msg) this.toast(r.msg); if(r.erro) this.toast(r.erro);
    const st=r.pasta?(r.ativa?'<b style="color:var(--g-tx)">Ativa</b> · verifica a cada '+r.intervalo+' s':'<b>Desativada</b>'):'<b>Nenhuma pasta escolhida</b>';
    const semPasta=r.bases.filter(b=>!r.pastas.some(p=>p.split(' / ').pop()===b));
    const subs=r.pastas.length?r.pastas.map(p=>`<div>📁 ${esc(p)}${r.bases.includes(p.split(' / ').pop())?'':' <span class="muted">(base será criada no 1º PDF)</span>'}</div>`).join(''):'<p class="muted">Nenhuma subpasta ainda.</p>';
    document.getElementById('modal').innerHTML=`<div class="box" style="width:640px"><h2>Pasta vigiada</h2>
      <p class="muted" style="margin:0 0 8px">Os PDFs (RSPE ou Ficha Disciplinar) salvos na subpasta de uma base entram sozinhos nessa base, com o programa aberto. O nome da subpasta é o nome da base.</p>
      <div class="help" style="font-family:ui-monospace,Consolas,monospace;font-size:12px;margin-bottom:8px">Pasta mãe\\<br>&nbsp;&nbsp;2ª VEP\\ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← RSPE e FD da base "2ª VEP"<br>&nbsp;&nbsp;1ª VEP\\ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← base "1ª VEP"<br><span class="muted">também vale: Pasta mãe\\RSPE\\2ª VEP\\ e Pasta mãe\\FD\\2ª VEP\\</span></div>
      <table class="subtab"><tr><td style="width:110px">Pasta mãe</td><td>${r.pasta?esc(r.pasta):'—'}</td></tr><tr><td>Situação</td><td>${st}</td></tr><tr><td>Última entrada</td><td>${r.ultima?esc(r.ultima):'—'}</td></tr></table>
      <h3 style="margin:10px 0 4px;font-size:13px">Subpastas</h3><div class="help" style="max-height:170px;overflow:auto">${subs}</div>
      ${r.pasta&&semPasta.length?`<p class="muted" style="margin:6px 0 0">Bases sem pasta: ${semPasta.map(esc).join(', ')}.</p>`:''}
      <p class="muted" style="margin:6px 0 0">PDF solto na pasta mãe é ignorado. Arquivo já lido não é lido de novo, salvo se for substituído. Nada é apagado nem movido.</p>
      <div class="acts" style="flex-wrap:wrap"><button class="btn" onclick="API().vigia_escolher().then(x=>x&&ui.modalVigia(x))">${r.pasta?'Trocar pasta mãe…':'Escolher pasta mãe…'}</button>
      ${r.pasta?`<button class="btn" onclick="API().vigia_ativar(${!r.ativa}).then(x=>ui.modalVigia(x))">${r.ativa?'Desativar':'Ativar'}</button>
      <button class="btn" onclick="API().vigia_criar_pastas().then(x=>ui.modalVigia(x))">Criar pastas das bases</button>
      <button class="btn" onclick="API().vigia_abrir()">Abrir pasta</button>
      <button class="btn" onclick="API().vigia_agora().then(x=>{if(x&&x.msg)ui.toast(x.msg)})">Verificar agora</button>`:''}
      <button class="btn pri" onclick="ui.fecharModal()">Fechar</button></div></div>`; document.getElementById('modal').classList.add('on'); },
  async defensores(){ const lista=await API().defensores_listar(); this._defs=(lista||[]).map(d=>Object.assign({},d)); this.renderDefensores(); },
  renderDefensores(){ const L=this._defs||[];
    const linhas=L.map((d,i)=>`<div class="chk" style="cursor:default;gap:6px;flex-wrap:wrap"><input type="radio" name="dpad" ${d.padrao?'checked':''} onchange="ui._defs.forEach((x,k)=>x.padrao=(k===${i}))" title="assina por padrão">
        <input value="${esc(d.nome)}" placeholder="Nome completo" style="flex:2;min-width:180px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit" oninput="ui._defs[${i}].nome=this.value">
        <input value="${esc(d.cargo||'Defensor Público')}" placeholder="Cargo" style="flex:1;min-width:130px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit" oninput="ui._defs[${i}].cargo=this.value">
        <input value="${esc(d.matricula||'')}" placeholder="Matrícula" style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit" oninput="ui._defs[${i}].matricula=this.value">
        <input value="${esc(d.email||'')}" placeholder="E-mail" style="flex:1;min-width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit" oninput="ui._defs[${i}].email=this.value">
        <span class="mini" style="color:var(--r-tx)" onclick="ui._defs.splice(${i},1);ui.renderDefensores()">Excluir</span></div>`).join('')||'<p class="muted">Nenhum defensor cadastrado.</p>';
    document.getElementById('modal').innerHTML=`<div class="box" style="width:820px;max-height:calc(100vh - 40px);display:flex;flex-direction:column"><h2>Defensores</h2><p class="muted" style="margin:0 0 8px">Quem pode assinar as petições. O marcado à esquerda é o padrão; na hora de gerar, você escolhe. Campos nos modelos: {{defensor}}, {{defensor_cargo}}, {{defensor_matricula}}, {{defensor_email}}.</p>
      <div class="help" style="flex:1;min-height:80px;overflow:auto">${linhas}</div>
      <div style="margin-top:8px"><button class="btn" onclick="ui._defs.push({nome:'',cargo:'Defensor Público',matricula:'',email:'',padrao:!ui._defs.length});ui.renderDefensores()">+ Adicionar defensor</button></div>
      <div class="acts"><button class="btn" onclick="ui.fecharModal()">Cancelar</button><button class="btn pri" onclick="ui.salvarDefensores()">Salvar</button></div></div>`; document.getElementById('modal').classList.add('on'); },
  async salvarDefensores(){ const r=await API().defensores_salvar(this._defs||[]); if(r&&r.erro) this.toast(r.erro); else { this.toast(r&&r.msg||'Salvo'); this.fecharModal(); } },
  async modeloAcao(acao, nome){ let r;
    if(acao==='renomear'){ const novo=prompt('Novo nome do modelo:', nome.replace(/\.docx$/i,'')); if(!novo) return; r=await API().modelo_renomear(nome, novo); }
    else if(acao==='excluir'){ if(!confirm('Excluir o modelo "'+nome+'"?')) return; r=await API().modelo_excluir(nome); }
    else if(acao==='novo'){ const n=prompt('Nome do novo modelo:', 'Novo modelo'); if(!n) return; r=await API().modelo_novo(n); }
    else if(acao==='campos'){ const c=await API().modelo_campos(); document.getElementById('modal').innerHTML=`<div class="box" style="width:640px"><h2>Campos disponíveis</h2><div class="help" style="max-height:60vh"><table class="subtab">${c.map(x=>`<tr><td style="white-space:nowrap"><b>{{${esc(x[0])}}}</b></td><td>${esc(x[1])}</td></tr>`).join('')}</table><p class="muted">Aceita condições do Jinja2: {% if falta_12m == 'Não consta' %}…{% endif %}. Campos com várias linhas (crimes_completo, prescricao_tabela, auditoria, ficha_atestados) ficam melhor sozinhos no parágrafo.</p></div><div class="acts"><button class="btn pri" onclick="ui.modelos()">Voltar</button></div></div>`; return; }
    else if(acao==='adicionar'){ r=await API().modelo_adicionar(); }
    else if(acao==='restaurar'){ r=await API().modelo_restaurar_padrao(); }
    else if(acao==='substituir'){ r=await API().modelo_substituir(nome); }
    else if(acao==='abrir'){ r=await API().modelo_abrir(nome); }
    else if(acao==='pasta'){ r=await API().modelo_pasta(); }
    if(r&&r.erro) this.toast(r.erro); else if(r&&r.msg) this.toast(r.msg);
    if(acao!=='abrir'&&acao!=='pasta') this.modelos(); },
  ajuda(){ document.getElementById('modal').innerHTML=`<div class="box" style="width:640px"><h2>Legenda e método</h2><div class="help">${this.dados.ajuda}</div><div class="acts"><button class="btn pri" onclick="ui.fecharModal()">Fechar</button></div></div>`; document.getElementById('modal').classList.add('on'); }
};
function curtoInd(t){ return (t||'').split(' | ')[0]; }
function penaExt(t){ return String(t).replace(/(-?)\b(\d+)a(\d+)m(\d+)d\b/g,(m0,sg,a,mm,d)=>{ a=+a; mm=+mm; d=+d; const p=[]; if(a)p.push(a+(a>1?' anos':' ano')); if(mm)p.push(mm+(mm>1?' meses':' mês')); if(d)p.push(d+(d>1?' dias':' dia')); if(!p.length) return '0 dia'; return sg+(p.length===1?p[0]:p.slice(0,-1).join(', ')+' e '+p[p.length-1]); }); }
function pl(n,a,b){ return n+' '+(n===1?a:b); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cmp(a,b){ const da=dt(a), db=dt(b); if(da&&db) return da-db; if(da) return -1; if(db) return 1; return String(a??'').localeCompare(String(b??''),'pt'); }
function dt(v){ const m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(v??'')); return m? new Date(+m[3],+m[2]-1,+m[1]).getTime():null; }
window.addEventListener('resize',()=>{ clearTimeout(ui._rz); ui._rz=setTimeout(()=>{ if(document.getElementById('tlv').classList.contains('on')) (ui._tlvModo==='ext'?ui.renderExtTL():ui.renderTLV()); },200); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ ui.fecharDrawer(); ui.fecharModal(); ui.fecharTLV(); } });
document.addEventListener('click',e=>ui.tlClick(e));
ui.letraAplicar();
// atalho para a busca de assistido (Ctrl+K ou /): em bases grandes, achar o nome sem rolar a lista
document.addEventListener('keydown',e=>{ const t=(e.target&&e.target.tagName)||''; if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')||(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t))){ e.preventDefault(); const q=document.getElementById('q'); q.focus(); q.select(); } });
window.addEventListener('pywebviewready', ()=>api('listar'));
if(window.__mockApi) api('listar');
</script>
