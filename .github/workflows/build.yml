name: Gerar APTO.exe

# Roda a cada envio para a branch main e também manualmente (aba Actions > "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Conferir que o código importa
        run: python -c "import rspe_scraper, rspe_view, rspe_auditoria, rspe_prescricao, rspe_export, rspe_ficha, rspe_remicao; print('ok')"

      - name: Testes de regressão (falha aqui = não gera o .exe)
        run: python testes.py

      - name: Compilar com PyInstaller
        run: >
          python -m PyInstaller --onefile --windowed --clean --name APTO
          --icon rspe.ico --add-data "rspe.ico;." --add-data "apto_selo.png;." --add-data "logo_defensoria.png;." --add-data "fontes;fontes" --add-data "ui.html;." --add-data "atendimentos;atendimentos" --add-data "base_juridica.json;." --add-data "teses_auto.bin;." --add-data "monitor_juris.bin;."
          --collect-data pdfminer --collect-data pdfplumber --collect-data reportlab --hidden-import reportlab.graphics.shapes --hidden-import rspe_relatorio --hidden-import rspe_remicao --hidden-import rspe_gabinete --hidden-import rspe_gabinete_api --hidden-import rspe_sei --hidden-import rspe_seeu --hidden-import rspe_nuspen --hidden-import nuspen_regras.leitura --hidden-import nuspen_regras.segmentacao
          --collect-all webview --collect-all pypdfium2 --collect-all pypdfium2_raw
          --exclude-module docxtpl --exclude-module docx --exclude-module docx2pdf
          rspe_app.py

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (Select-String -Path rspe_app.py -Pattern 'VERSAO = "([^"]+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item dist\APTO.exe pacote\
          Copy-Item LEIA-ME.txt, RSPE_BASE_Memorial_Tecnico-Juridico_de_Parametros.pdf pacote\
          # extensão do navegador (RSPE do SEEU, Triagem da Mesa, SIAPEN e SAP): pasta pronta para "Carregar sem compactação"
          Copy-Item -Recurse extensao_seeu pacote\extensao_seeu
          if (-not (Test-Path pacote\extensao_seeu\manifest.json)) { throw "extensao_seeu não entrou no pacote" }
          # o laboratório (SEI fictício e os testes do leitor) não vai para quem usa: só fica no repositório
          Remove-Item -Recurse -Force pacote\extensao_seeu\sei\teste, pacote\extensao_seeu\sei\lib\adaptador_ficticio.js, pacote\extensao_seeu\sei\lib\adaptador_sei_real.js -ErrorAction SilentlyContinue
          # OCR embutido (7.29): o Tesseract (Apache 2.0) e só o português "rápido" (tessdata_fast), numa pasta ao lado do APTO.exe
          choco install tesseract -y --no-progress
          $t = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$t\tesseract.exe")) { throw "Tesseract não instalado no build" }
          Copy-Item -Recurse $t pacote\tesseract
          Get-ChildItem pacote\tesseract\tessdata -Filter *.traineddata | Remove-Item -Force
          Remove-Item -Recurse -Force pacote\tesseract\tessdata\script, pacote\tesseract\tessdata\tessconfigs, pacote\tesseract\doc, pacote\tesseract\*uninstall* -ErrorAction SilentlyContinue
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata" -OutFile pacote\tesseract\tessdata\por.traineddata
          Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/LICENSE" -OutFile pacote\tesseract\LICENSE-Tesseract-Apache-2.0.txt
          & pacote\tesseract\tesseract.exe --version
          $l = & pacote\tesseract\tesseract.exe --list-langs --tessdata-dir pacote\tesseract\tessdata 2>&1 | Out-String
          if ($l -notmatch "por") { throw "o português do OCR não entrou no pacote" }
          "{0:N1} MB" -f ((Get-ChildItem -Recurse pacote\tesseract | Measure-Object Length -Sum).Sum / 1MB)
          Compress-Archive -Path pacote\* -DestinationPath "APTO_v${{ steps.versao.outputs.v }}.zip"

      - name: Guardar o .exe (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: APTO_v${{ steps.versao.outputs.v }}
          path: pacote/*
          retention-days: 30

      - name: Publicar em Releases (link fixo para baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: APTO v${{ steps.versao.outputs.v }}
          body: "Gerado automaticamente a partir do commit ${{ github.sha }}. Baixe o .zip, extraia e rode APTO.exe (Windows 10/11); deixe a pasta tesseract (OCR) ao lado do APTO.exe. A pasta extensao_seeu é a extensão do navegador (Chrome/Edge): chrome://extensions > Modo do desenvolvedor > Carregar sem compactação (veja extensao_seeu\\LEIA-ME.txt). Ela também lê a fila do SAP para a função Atendimentos."
          files: APTO_v${{ steps.versao.outputs.v }}.zip
          make_latest: true
